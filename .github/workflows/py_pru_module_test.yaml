name: Test shepherd_pru

on:
  workflow_call:

permissions: {}

jobs:
  pru-test:
    concurrency:
      group: pypru-${{ github.workflow }}-${{ github.ref }}-${{ matrix.cape_hw_ver }}-${{ matrix.python-version }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.13"]
        cape_hw_ver: [ "24", "25" ]
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Install uv 🔧 & set up Python 🐍
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          activate-environment: true

      - name: Install dependency 🔧
        run: sudo apt install build-essential

      - name: Build shepherd_pru Py-Module 🧱
        run: "make"
        working-directory: "./software/firmware/pru0-module-py"
      - name: Install the shepherd_pru Py-package 🐑
        run: "uv pip install .[test]"
        working-directory: "./software/firmware/pru0-module-py"
      - name: Test the shepherd py-package 🐐
        run: "pytest"
        working-directory: "./software/firmware/pru0-module-py"
