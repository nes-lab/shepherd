[defaults]
host_key_checking = False
# ⤷ dangerous outside of a controlled env, but speeds up playbooks
forks=50
# ⤷ parallel instances (should be >host-size)
inventory = inventory
# inventory = /etc/shepherd/herd.yaml
# TODO: try list to also hint at /etc/shepherd/herd.yaml or ~/herd.yaml
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts_cache
fact_caching_timeout = 86400
# ⤷ cache gathered facts (collect once, 24h TTL, not every playbook run)

[ssh_connection]
#ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ControlMaster=auto -o ControlPersist=60s
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ControlMaster=auto -o Compression=no -o ControlPersist=300s
# ⤷ speedups related to ssh,
#     - "ControlPersist=60s" destabilized reboots -> try larger value
#     - skipping compression should lower cpu-overhead (100% during playbooks)
pipelining = True
# ⤷ saves ssh-connections (speedup)
