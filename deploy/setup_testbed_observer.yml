---

- name: Integrate Nodes into Testbed
  hosts: sheep
  become: true

  pre_tasks:

    - name: Get time and date from ansible controller
      ansible.builtin.command: 'date -u +"%Y-%m-%dT%H:%M:%SZ"'
      delegate_to: localhost
      changed_when: false
      register: local_time
      become: false
    - name: Set correct time
      ansible.builtin.command: "date -s {{ local_time.stdout }}"
      changed_when: true

- name: Role - Testbed Observer
  hosts: sheep
  become: true
  roles:
    - testbed_observer

- name: Role - Secured Testbed
  hosts: sheep
  become: true
  roles:
    - secure_testbed
