---
# cleans up sheep0 to allow pulling an image

- name: Delete space wasting or forgotten files (WARNING - includes recordings) and cleans up free space to prepare image-extraction
  hosts: sheep
  become: true
  gather_facts: true

  vars:
    cmd_ssh: "ssh {{ ansible_user }}@{{ inventory_hostname }}"
    image_name: "shepherd--console-armhf-{{ ansible_date_time.date }}-4gb.img.xz"

  tasks:

    - name: Cleanup Beaglebone
      ansible.builtin.include_role:
        name: cleaning
      vars:
        cleaning_delete_recordings: true
        cleaning_remove_software: false
        cleaning_zero_free_space: true
        cleaning_shepherd_repo_files: true

    - name: Last Step - run the following backup-command manually
      ansible.builtin.debug:
        msg:
          - "eMMC"
          - "{{ cmd_ssh }} 'sudo dd if=/dev/mmcblk1 bs=4M iflag=fullblock status=progress' | xz -6 -T0 > {{ image_name }}"
          - " -> better: shutdown, start from SD-Card, check FS (fsck -p /dev/mmcblk1p1), copy"
          - "SD-Card"
          - "{{ cmd_ssh }} 'sudo dd if=/dev/mmcblk0 bs=4M iflag=fullblock status=progress' | xz -6 -T0 > {{ image_name }}"
          - "-> better: shutdown, remove card and prepare image on external device"

