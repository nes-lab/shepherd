---

- name: Stop Kernel Module
  ansible.builtin.command: 'modprobe -rf {{ item }}'
  failed_when: false
  loop:
    - shepherd  # just repeat 3 times
    - shepherd
    - shepherd
  # lsmod | grep shepherd
  #   -> loaded: 2 lines, exit 0
  #   -> notload: 0 lines, exit 1
  # return of lsmod not working as expected

- name: Check if PRU1 is present
  ansible.builtin.stat:
    path: "/sys/class/remoteproc/remoteproc1/state"
  register: sysfs_pru
- name: Stop PRU1
  ansible.builtin.shell:
    cmd: 'echo "stop" > /sys/class/remoteproc/remoteproc1/state'
  when: sysfs_pru.stat.exists
  failed_when: false
  changed_when: true

- name: Check if PRU2 is present
  ansible.builtin.stat:
    path: "/sys/class/remoteproc/remoteproc2/state"
  register: sysfs_pru
- name: Stop PRU2
  ansible.builtin.shell:
    cmd: 'echo "stop" > /sys/class/remoteproc/remoteproc2/state'
  when: sysfs_pru.stat.exists
  failed_when: false
  changed_when: true

- name: PIP - Upgrade UV
  # Note: done via pip to get universal access (root, sudo, jane)
  ansible.builtin.command:
    cmd: pip install uv --upgrade --break-system-packages
  become: true

- name: UV - Uninstall shepherd python package (Sys instead of vEnv)
  ansible.builtin.command:
    cmd: "/usr/local/bin/uv pip uninstall {{ item }} --system --break-system-packages"
    chdir: '/home/{{ ansible_user }}'
  loop:
    - shepherd-core
    - shepherd_core
    - shepherd-sheep
    - shepherd_sheep
  tags:
    - install
    - python
  when: sheep_rebuild_python_package | bool
  become: true
  # there were situations were the core-lib stayed old (installed via pip)

- name: Get full path of repository
  ansible.builtin.command: "realpath {{ role_path }}/../../.."
  delegate_to: localhost
  register: repo_dir
  become: false
  changed_when: false

- name: Synchronize host shepherd dir to target
  ansible.posix.synchronize:
    src: "{{ repo_dir.stdout }}/software"
    dest: "{{ sheep_install_path }}/software"
    delete: true
    owner: false
    group: false
    compress: false
    rsync_opts:
      - "--exclude=.eggs"
      - "--exclude=__pycache__"
  when: sheep_refresh_source | bool

- name: Own shepherd codebase
  ansible.builtin.file:
    path: "{{ sheep_install_path }}/"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "a+rw"
    recurse: true
  become: true
  tags:
    - source-code
    - python

- name: Enable execution of manual build-scripts
  ansible.builtin.file:
    path: "{{ item }}"
    state: file
    owner: "{{ ansible_user }}"
    mode: "a+rwx"
  become: true
  loop:
    - "{{ sheep_install_path }}/software/build_py.sh"
    - "{{ sheep_install_path }}/software/build_pru.sh"
    - "{{ sheep_install_path }}/software/build_kernel.sh"
  tags:
    - source-code
    - python
