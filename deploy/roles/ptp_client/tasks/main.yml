---
- name: Configure PTP for client-only mode
  ansible.builtin.lineinfile:
    dest: "/etc/linuxptp/ptp4l.conf"
    regexp: "{{ item.regex }}"
    line: "{{ item.replacement }}"
    state: present
  loop:
    - {
      regex: "slaveOnly.*$",
      replacement: "slaveOnly  1", # was 0
    }
    - {
      regex: "masterOnly.*$",
      replacement: "masterOnly  0", # was 0
    }
    - {
      regex: "priority1.*$",
      replacement: "priority1  128", # was 128
    }
    - {
      regex: "clockClass.*$",
      replacement: "clockClass  248", # was 248
    }
    - {
      regex: "clockAccuracy.*$",
      replacement: "clockAccuracy  0xFE", # was 0xFE
    }
  tags:
    - ptp
    - conf

- name: Disable GPS and NTP services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    daemon_reload: true
  loop:
    - chrony.service
    - gpsd.service
    - gpsd.socket
    - systemd-timesyncd.service
  failed_when: false  # services may not exist
  tags:
    - ptp
    - conf

- name: Enable ptp services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
    enabled: true
    daemon_reload: true
  loop:
    - phc2sys@eth0.service
    - ptp4l@eth0.service
  failed_when: false  # services may not exist
  tags:
    - ptp
    - conf
