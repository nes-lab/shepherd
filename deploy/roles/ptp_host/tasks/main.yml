---
- name: APT - Update Cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install ptp package
  ansible.builtin.apt:
    name: linuxptp
    state: present
  tags: ptp

- name: Configure PTP
  ansible.builtin.lineinfile:
    dest: "/etc/linuxptp/ptp4l.conf"
    regexp: "{{ item.regex }}"
    line: "{{ item.replacement }}"
    state: present
  loop:
    - {
      regex: "clock_servo.*$",
      replacement: "clock_servo  pi",
      # NOTE: linreg is faster at start, BUT Pi is more precise here
    }
    - {
      regex: "time_stamping.*$",
      replacement: "time_stamping     hardware",
    }
  tags:
    - ptp
    - conf

- name: Configure PTP for higher timeouts
  ansible.builtin.lineinfile:
    dest: "/etc/linuxptp/ptp4l.conf"
    regexp: "{{ item.regex }}"
    line: "{{ item.replacement }}"
    state: present
  loop:
    - {
      regex: "^.?tx_timestamp_timeout.*$",
      replacement: "tx_timestamp_timeout  10", # 1 is default
    }

- name: Install ntpdate package
  ansible.builtin.apt:
    name: ntpdate
    state: present
  tags: ptp

- name: Deploy systemd overlay files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/"
    # originals are kept in /lib/systemd/system/
    mode: '0644'
  loop:
    - "phc2sys@.service"
    - "ptp4l@.service"
  tags:
    - ptp
    - conf
  # Tests
  # manual: sudo systemctl restart ptp4l@eth0
  # status: sudo journalctl -u ptp4l@eth0 -f

- name: Deploy prio-script for kworker
  ansible.builtin.copy:
    src: "set-ptp-kworker-prio.sh"
    dest: "/usr/local/bin/"
    mode: '0755'
  tags:
    - ptp
    - conf

- name: allow more RT-threads
  ansible.builtin.lineinfile:
    dest: "/etc/sysctl.d/99-rt.conf"
    regexp: "^.?kernel.sched_rt_runtime_us.*$"
    line: "kernel.sched_rt_runtime_us = -1"
    state: present
    create: true

- name: allow more RT-threads (immediate)
  ansible.builtin.shell:
    cmd: sudo sysctl -w kernel.sched_rt_runtime_us=-1

- name: Install ethtool
  ansible.builtin.apt:
    name: ethtool
    state: present
  tags: ptp

- name: Check interface capabilities
  ansible.builtin.shell:
    cmd: "set -o pipefail && ethtool -T eth0 | grep {{ item }}"
  loop:
    - hardware-raw-clock
    - hardware-transmit
    - hardware-receive
  failed_when: false
  tags: ptp

- name: Determine CPU-Governor
  ansible.builtin.command: 'cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor'
  register: cpu_governor
  changed_when: false

- name: Check active CPU-Governor (should be 'performance')
  ansible.builtin.debug:
    msg:
      - "gov={{ cpu_governor.stdout.strip() }}"
