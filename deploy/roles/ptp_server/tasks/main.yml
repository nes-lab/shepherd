---
- name: Configure PTP for server-mode (time-coordinator)
  ansible.builtin.lineinfile:
    dest: "/etc/linuxptp/ptp4l.conf"
    regexp: "{{ item.regex }}"
    line: "{{ item.replacement }}"
    state: present
  loop:
    - {
      regex: "slaveOnly.*$",
      replacement: "slaveOnly  0", # was 0
    }
    - {
      regex: "masterOnly.*$",
      replacement: "masterOnly  1", # was 0
    }
    # BMCA Prio (0 ... 128)
    - {
      regex: "priority1.*$",
      replacement: "priority1  10", # was 128

    }
    # make it GM with very high accuracy
    - {
      regex: "clockClass.*$",
      replacement: "clockClass  20", # was 248
    }
    - {
      regex: "clockAccuracy.*$",
      replacement: "clockAccuracy  0x5E", # was 0xFE

    }
    - {
      regex: "userDescription.*$",
      replacement: "userDescription  rpi_gm", # was ;
    }
  tags:
    - ptp
    - conf

- name: Disable NTP service
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: stopped
    enabled: false
    daemon_reload: true
  failed_when: false  # services may not exist
  tags:
    - ptp
    - conf

- name: Disable GPS services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    daemon_reload: true
  loop:
    - gpsd.socket
    - chrony.service
  when: '"gps_clients" not in group_names'
  failed_when: false  # services may not exist
  tags:
    - ptp
    - conf

- name: Enable PTP services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
    enabled: true
    daemon_reload: true
  loop:
    - phc2sys@eth0.service
    - ptp4l@eth0.service
  failed_when: false  # services may not exist
  tags:
    - ptp
    - conf
